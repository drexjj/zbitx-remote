name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Verify APK integrity
        run: |
          ls -la app/build/outputs/apk/debug/
          file app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | head -20
          cp app/build/outputs/apk/debug/app-debug.apk sbitx-remote.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbitx-remote-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Publish the raw .apk on a GitHub (pre)release so it can be downloaded
      # directly on a phone browser - no artifact zip, no login required.
      - name: Publish APK to latest-build release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build
          prerelease: true
          files: sbitx-remote.apk
          body: |
            Automated debug build from ${{ github.sha }} on ${{ github.ref_name }}.
            Download sbitx-remote.apk below and install directly.
