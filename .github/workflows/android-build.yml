name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # Version numbers: main releases are v1, v2, ... ;
      # feature/beta builds are v<last>.<run#>, e.g. Beta v1.5
      - name: Compute versions
        id: relver
        run: |
          git fetch --tags --quiet
          last=$(git tag -l 'v[0-9]*' | sed 's/^v//' | sort -n | tail -1)
          last=${last:-0}
          echo "next=v$(( last + 1 ))" >> "$GITHUB_OUTPUT"
          echo "beta=v${last}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            gradle assembleDebug --no-daemon -PverCode=${{ github.run_number }} -PrelVersion="${{ steps.relver.outputs.next }}"
          else
            gradle assembleDebug --no-daemon -PverCode=${{ github.run_number }} -PrelVersion="Beta ${{ steps.relver.outputs.beta }}"
          fi

      - name: Verify APK integrity
        run: |
          ls -la app/build/outputs/apk/debug/
          file app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | head -20
          cp app/build/outputs/apk/debug/app-debug.apk sbitx-remote.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbitx-remote-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Non-main branches: rolling pre-release for testers.
      - name: Publish APK to latest-build pre-release
        if: github.event_name == 'push' && github.ref_name != 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest test build
          prerelease: true
          files: sbitx-remote.apk
          body: |
            Beta ${{ steps.relver.outputs.beta }} from ${{ github.ref_name }} (${{ github.sha }}).
            Download sbitx-remote.apk below and install directly.

      # Pushes to main (e.g. merged PRs): proper versioned release.
      - name: Publish versioned release (main)
        if: github.event_name == 'push' && github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.relver.outputs.next }}
          name: sBitx Remote ${{ steps.relver.outputs.next }}
          prerelease: false
          files: sbitx-remote.apk
          body: |
            sBitx Remote ${{ steps.relver.outputs.next }} — built from main (${{ github.sha }}).
            Download sbitx-remote.apk below and install on Android 8.0+.
            Requires drexjj/sbitx firmware v5.0+ and Tailscale for internet use. 73 de VU3UBP
