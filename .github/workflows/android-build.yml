name: Build Android APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history + tags for the version name

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's ubuntu runners already include the Android SDK (ANDROID_HOME),
      # and this repo has no ./gradlew script, so install Gradle directly.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # Version shown in the app: the tag on a tag build (v1.0.2), otherwise
      # the last tag plus commits since it (v1.0.1-3-g1a2b3c4).
      # Version code: the run number, which goes up on every build, so each new
      # APK installs over the previous one.
      - name: Compute version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="$(git describe --tags --always)"
          fi
          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "code=$(( 100 + ${{ github.run_number }} ))" >> "$GITHUB_OUTPUT"
          echo "Building ${VERSION} (code $(( 100 + ${{ github.run_number }} )))"

      - name: Build APK
        run: >
          gradle assembleDebug --no-daemon
          -PrelVersion="${{ steps.ver.outputs.name }}"
          -PverCode=${{ steps.ver.outputs.code }}

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             "zBitx-Remote-${{ steps.ver.outputs.name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zBitx-Remote-APK
          path: zBitx-Remote-*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: zBitx-Remote-*.apk
          generate_release_notes: true
          name: zBitx Remote ${{ github.ref_name }}
